<div
  aria-live="polite"
  role="status"
  class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-[calc(100vw-2rem)]"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-center gap-3 bg-white border border-emerald-200 shadow-lg rounded-xl pl-4 pr-2 py-3 text-sm text-gray-800"
    >
      <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
      <span class="font-semibold">{{ toast.message }}</span>
      <button
        type="button"
        aria-label="Cerrar notificación"
        (click)="toastService.dismiss(toast.id)"
        class="ml-1 p-1 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition-colors"
      >
        ✕
      </button>
    </div>
  }
</div>
