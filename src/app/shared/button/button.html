<button
  [type]="type()"
  [disabled]="disabled()"
  (click)="btnClick.emit($event)"
  class="inline-flex items-center justify-center font-medium rounded-lg transition-colors focus:outline-hidden focus-visible:ring-2 disabled:opacity-50 disabled:cursor-not-allowed"
  [ngClass]="[variantClasses, sizeClasses]"
>
  <ng-content />
</button>
