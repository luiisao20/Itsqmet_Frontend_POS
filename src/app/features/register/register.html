<div class="min-h-[calc(100vh-140px)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-lg w-full bg-white rounded-3xl border border-emerald-100 shadow-md p-8 sm:p-10">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-emerald-100 text-emerald-800 rounded-2xl flex items-center justify-center text-xl mx-auto mb-3 shadow-xs">
        📝
      </div>
      <h2 class="text-2xl font-black text-emerald-950 tracking-tight">Registro de Cliente</h2>
      <p class="text-xs text-gray-500 mt-1">
        Crea tu cuenta para realizar pedidos para llevar y gestionar tus facturas
      </p>
    </div>

    @if (errorMessage()) {
      <div class="mb-4 p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 text-xs flex items-center gap-2">
        <span>⚠️</span>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form (submit)="onRegister(); $event.preventDefault()" class="space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">
            Tipo de Identificación *
          </label>
          <select
            [ngModel]="tipoIdentificacion()"
            (ngModelChange)="tipoIdentificacion.set($event)"
            name="tipoIdentificacion"
            class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-gray-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-hidden bg-gray-50/50"
          >
            <option value="CEDULA">Cédula</option>
            <option value="RUC">RUC</option>
            <option value="PASAPORTE">Pasaporte</option>
            <option value="CONSUMIDOR_FINAL">Consumidor Final</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">
            Número de Documento *
          </label>
          <input
            type="text"
            [ngModel]="identificacion()"
            (ngModelChange)="identificacion.set($event)"
            name="identificacion"
            required
            placeholder="ej: 1718293041"
            class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-gray-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-hidden bg-gray-50/50"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">
          Nombres Completos o Razón Social *
        </label>
        <input
          type="text"
          [ngModel]="razonSocial()"
          (ngModelChange)="razonSocial.set($event)"
          name="razonSocial"
          required
          placeholder="ej: Juan Fernando Pérez"
          class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-gray-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-hidden bg-gray-50/50"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">
            Correo Electrónico *
          </label>
          <input
            type="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            required
            placeholder="juan.perez@gmail.com"
            class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-gray-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-hidden bg-gray-50/50"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">
            Teléfono Móvil
          </label>
          <input
            type="text"
            [ngModel]="telefono()"
            (ngModelChange)="telefono.set($event)"
            name="telefono"
            placeholder="0998765432"
            class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-gray-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-hidden bg-gray-50/50"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">
          Dirección Domiciliaria
        </label>
        <input
          type="text"
          [ngModel]="direccion()"
          (ngModelChange)="direccion.set($event)"
          name="direccion"
          placeholder="Av. Amazonas y República"
          class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-gray-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-hidden bg-gray-50/50"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">
          Contraseña (mínimo 6 caracteres) *
        </label>
        <input
          type="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          required
          placeholder="••••••••"
          class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-gray-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-hidden bg-gray-50/50"
        />
      </div>

      <div class="pt-2">
        <app-button
          type="submit"
          variant="primary"
          size="lg"
          [disabled]="loading()"
          class="w-full [&>button]:w-full"
        >
          {{ loading() ? 'Creando cuenta...' : 'Registrar y Continuar' }}
        </app-button>
      </div>

      <div class="text-center pt-3 border-t border-gray-100">
        <p class="text-xs text-gray-500">
          ¿Ya tienes cuenta?
          <a routerLink="/login" class="text-emerald-700 font-bold hover:underline">
            Inicia sesión aquí
          </a>
        </p>
      </div>
    </form>
  </div>
</div>
